<!DOCTYPE html>
<!--
  TablePro rebuild — Stage 3 fan-out mockup (partition: overlays / settings / engine panels / error surface)
  SCR-64 About Dialog
  Authority: ../design-spec.md · ../screens.md · ../tokens.css (shared, not forked)

  AUDIT REMEDIATION PHASE 2 — applied against design-spec.md 5.16 canon:
    B2: --color-text-muted was text (caption, desc, divider, theme toggle) —
        moved to --color-text-secondary; it is now non-text only.
    Canon .dialog: no border, radius-lg, shadow-modal, banded header/body,
        width class .md (560px, per 5.16's explicit SCR-64 assignment),
        max-height min(680px, 100vh - 2*space-3xl). No footer band — the
        dialog has no action buttons beyond dismiss (Esc / the header close
        control), so an empty footer band was omitted rather than padded
        for its own sake; flagged in the fan-out report as a judgment call.
    Canon .iconbtn: close button now uses the shared .iconbtn rule (rest
        fg text-secondary, hover bg-hover + text-primary — audit M10).
    Canon .board: max-width 1400px/margin auto/padding 3xl+xl/gap 3xl/
        bg-base; SCR ID moved into the canonical `.scr` chip.
    m8: aria-hidden="true" added to every inline icon <svg>.
    m10: the close button is shown in its permanent focused state so the
        mandatory ring is visible in this file, matching sheet-bulk-dialogs
        / sheet-confirm-dialogs.

  Content is sourced verbatim from src/i18n/locales/en.json (about.version,
  about.description, about.platform) and src/components/shared/about-dialog.tsx
  (title "TablePro", version string, divider before the platform line). App
  version 0.7.0 is package.json's real shipped version, not a placeholder.

  Modality: role="dialog" aria-modal="true" (design-spec 5.16, audit M2).

  Theme scaffolding only (not a product feature): the toggle writes data-theme
  on <html> and syncs the `light` class, because tokens.css keys on `.light` —
  the mechanism the app really ships (src/hooks/useTheme.ts). Copied verbatim
  from ../mockups/scr-17-table-browse.html.

  Reference for a later implementation. Not for pasting into the component system.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>SCR-64 About Dialog — TablePro rebuild</title>
<link rel="stylesheet" href="../tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);font-size:var(--font-size-sm);line-height:var(--line-height-sm);
  background:var(--color-bg-base);color:var(--color-text-primary);
  -webkit-font-smoothing:antialiased;
}
svg{display:block;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:var(--focus-ring-width) solid var(--color-focus-ring);outline-offset:var(--focus-ring-offset)}

/* Canonical .board — design-spec 5.16 */
.board{max-width:1400px;margin:0 auto;padding:var(--space-3xl) var(--space-xl);
  display:flex;flex-direction:column;align-items:center;gap:var(--space-3xl);background:var(--color-bg-base)}
.scr{color:var(--color-text-secondary);font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);
  text-transform:uppercase;letter-spacing:.06em}
.themetoggle{display:flex;align-items:center;gap:var(--space-xs);height:var(--control-h-xs);
  padding:0 var(--space-sm);border:1px dashed var(--color-border);border-radius:var(--radius-xs);
  color:var(--color-text-secondary);font-size:var(--font-size-2xs);align-self:flex-end}

/* Canonical .iconbtn — design-spec 5.16 */
.iconbtn{height:var(--control-h-sm);width:var(--control-h-sm);display:grid;place-items:center;flex:none;
  border-radius:var(--radius-sm);color:var(--color-text-secondary);
  transition:background var(--duration-fast) var(--ease-snappy),color var(--duration-fast) var(--ease-snappy)}
.iconbtn:hover{background:var(--color-bg-hover);color:var(--color-text-primary)}
.demo-focus{outline:var(--focus-ring-width) solid var(--color-focus-ring);outline-offset:var(--focus-ring-offset)}

/* ---------- Canonical .dialog — design-spec 5.16, width class .md (560px) ---------- */
.dialog{width:100%;max-width:560px;max-height:min(680px, calc(100vh - var(--space-3xl) * 2));
  display:flex;flex-direction:column;background:var(--color-bg-elevated);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-modal);overflow:hidden}
.dhead{flex:none;display:flex;align-items:center;gap:var(--space-md);
  padding:var(--space-xl) var(--space-2xl);border-bottom:1px solid var(--color-border-subtle)}
.dhead h1{font-size:var(--font-size-xl);font-weight:var(--font-weight-semibold)}
.spacer{flex:1}
.dbody{flex:1;overflow:auto;padding:var(--space-2xl);
  display:flex;flex-direction:column;align-items:center;gap:var(--space-md);text-align:center}
.mark{height:56px;width:56px;display:grid;place-items:center;border-radius:var(--radius-lg);
  background:var(--color-accent-blue-subtle);color:var(--color-accent-blue)}
.version{font-size:var(--font-size-md);color:var(--color-text-secondary)}
.desc{font-size:var(--font-size-xs);color:var(--color-text-secondary);max-width:280px}
.divider{width:100%;border-top:1px solid var(--color-border-subtle);margin-top:var(--space-sm);
  padding-top:var(--space-sm);font-size:var(--font-size-xs);color:var(--color-text-secondary)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="i-table" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M10 3v18"/></symbol>
<symbol id="i-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
</defs></svg>

<div class="board">
  <button class="themetoggle" id="themebtn" title="Mockup scaffolding — not a product control">
    <svg width="11" height="11" aria-hidden="true"><use href="#i-theme"/></svg><span id="themelabel">Dark</span>
  </button>

  <span class="scr">SCR-64 &middot; About Dialog</span>

  <div class="dialog" role="dialog" aria-modal="true" aria-label="TablePro">
    <div class="dhead">
      <h1>TablePro</h1>
      <span class="spacer"></span>
      <button class="iconbtn demo-focus" aria-label="Close"><svg width="14" height="14" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="dbody">
      <div class="mark"><svg width="26" height="26" aria-hidden="true"><use href="#i-table"/></svg></div>
      <p class="version">Version 0.7.0 (Windows)</p>
      <p class="desc">Database client for PostgreSQL, MySQL, and SQL Server.</p>
      <div class="divider">Platform: Win32</div>
    </div>
  </div>
</div>

<script>
(function () {
  var root = document.documentElement, label = document.getElementById('themelabel');
  function set(t) {
    root.dataset.theme = t;
    root.classList.toggle('light', t === 'light');
    label.textContent = t === 'light' ? 'Light' : 'Dark';
  }
  document.getElementById('themebtn').addEventListener('click', function () {
    set(root.dataset.theme === 'light' ? 'dark' : 'light');
  });
  set('dark');
})();
</script>
</body>
</html>
