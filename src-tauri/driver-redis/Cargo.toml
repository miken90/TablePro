[package]
name = "driver-redis"
version = "0.1.0"
edition = "2021"

[dependencies]
driver-common = { path = "../driver-common" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp"] }
serde_json = "1"

[lib]
name = "driver_redis"
crate-type = ["rlib"]
