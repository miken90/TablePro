[package]
name = "driver-mongodb"
version = "0.1.0"
edition = "2021"

[dependencies]
tablepro-plugin-sdk = { path = "../plugin-sdk" }
mongodb = { version = "3", features = ["sync"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[lib]
name = "driver_mongodb"
crate-type = ["cdylib"]
