<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5AADFF"/>
      <stop offset="100%" stop-color="#2D7DD2"/>
    </linearGradient>
    <linearGradient id="s-cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4E4F4"/>
      <stop offset="50%" stop-color="#F5F8FC"/>
      <stop offset="100%" stop-color="#CDE0F0"/>
    </linearGradient>
    <linearGradient id="s-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFCFE"/>
      <stop offset="100%" stop-color="#E0EBF5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="4" y="4" width="72" height="72" rx="16" ry="16" fill="url(#s-bg)"/>

  <!-- Shadow -->
  <ellipse cx="40" cy="62" rx="16" ry="3" fill="#1A5A9E" opacity="0.3"/>

  <!-- Database cylinder - body -->
  <path d="M 22 28 L 22 52 Q 22 60 40 60 Q 58 60 58 52 L 58 28 Q 58 34 40 34 Q 22 34 22 28 Z"
        fill="url(#s-cyl)"/>

  <!-- Middle band -->
  <path d="M 22 42 Q 22 47 40 47 Q 58 47 58 42"
        fill="none" stroke="#A0B8D0" stroke-width="1"/>
  <path d="M 22 43 Q 22 48 40 48 Q 58 48 58 43"
        fill="none" stroke="#E8EFF7" stroke-width="0.5"/>

  <!-- Top ellipse -->
  <ellipse cx="40" cy="28" rx="18" ry="8" fill="url(#s-top)"/>
  <ellipse cx="40" cy="28" rx="18" ry="8" fill="none" stroke="#93B4D4" stroke-width="1"/>

  <!-- Inner ellipse on top -->
  <ellipse cx="40" cy="28" rx="13" ry="5" fill="none" stroke="#C0D4E8" stroke-width="0.8"/>

  <!-- Specular highlight -->
  <ellipse cx="37" cy="26" rx="8" ry="3" fill="#FFFFFF" opacity="0.55" transform="rotate(-6 37 26)"/>
</svg>
